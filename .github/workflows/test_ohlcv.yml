name: Test CMC OHLCV

on:
  workflow_dispatch:

jobs:
  test-ohlcv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run CMC OHLCV test
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
        run: node test_cmc_ohlcv.js
