name: BullBear Live Test

on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test-bullbear:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Run BullBear
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
        run: |
          node -e "
          const { runBullBear } = require('./bullbear_engine.js');

          runBullBear('BTC')
            .then(result => {
              console.log('');
              console.log('================================');
              console.log('       ORACLE AI BULLBEAR');
              console.log('================================');
              console.log('Coin:', result.coin);
              console.log('Name:', result.name);
              console.log('Price:', result.price);
              console.log('BullBear Score:', result.bullBearScore);
              console.log('Direction:', result.direction);
              console.log('Confidence:', result.confidence);
              console.log('');

              console.log('FACTORS:');
              result.factors.forEach((factor, index) => {
                console.log((index + 1) + '. ' + factor);
              });

              console.log('');
              console.log('HISTORICAL ANALYTICS:');
              console.log('Volume Ratio:', result.historicalVolumeRatio);
              console.log('Daily Volatility:', result.dailyVolatility);
              console.log('Annualized Volatility:', result.annualizedVolatility);
              console.log('Positive Days:', result.positiveDays);
              console.log('Negative Days:', result.negativeDays);
              console.log('Positive Ratio:', result.positiveRatio);
              console.log('');
              console.log('CALIBRATION:');
              console.log('');
              console.log(
              'Volatility Percentile:',
              result.calibration.volatility.volatilityPercentile
              );
              console.log(
              'Volatility Score:',
              result.calibration.volatility.volatilityScore
              );
              console.log(
              'Volume Percentile:',
              result.calibration.volume.volumePercentile
              );
              console.log(
              'Volume Score:',
               result.calibration.volume.volumeScore
               );
               console.log(
               'Trend Score:',
               result.calibration.trend.trendScore
               );
              console.log('Market Cap:', result.marketCap);
              console.log('24h Volume:', result.volume24h);
              console.log('1h Change:', result.change1h);
              console.log('24h Change:', result.change24h);
              console.log('7d Change:', result.change7d);
              console.log('30d Change:', result.change30d);
              console.log('Last Updated:', result.lastUpdated);
              console.log('================================');
              require('fs').writeFileSync('data/bullbear_signal_history.json', JSON.stringify([...(require('fs').existsSync('data/bullbear_signal_history.json') ? JSON.parse(require('fs').readFileSync('data/bullbear_signal_history.json','utf8')) : []), { timestamp: new Date().toISOString(), ...result }], null, 2));
              })
            .catch(error => {
              console.error('BULLBEAR TEST FAILED');
              console.error(error.message);
              process.exit(1);
            });
          "
      - name: Save BullBear signal history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bullbear_signal_history.json
          git diff --cached --quiet || git commit -m "Update BullBear signal history"
          git push
