name: BullBear Branch Tests

on:
  push:
    branches:
      - jasonscoby-bit-patch-1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test BullBear scoring model
        run: node --test bullbear_engine.test.js
