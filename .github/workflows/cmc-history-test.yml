name: CMC Historical Test

on:
  workflow_dispatch:

jobs:
  test-history:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Test Historical CMC Data
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_
        run: node cmc_history_probe.js
