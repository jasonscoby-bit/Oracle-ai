name: BullBear Performance

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"
permissions:
  contents: write

jobs:
  performance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify BullBear code
        run: |
          echo "=== COMMIT ==="
          git rev-parse HEAD
          echo "=== PERFORMANCE FILE ==="
          sed -n '1,12p' bullbear_performance.js
          echo "=== EVALUATOR REFERENCES ==="
          grep -n "bullbear_evaluator" bullbear_performance.js || echo "No bullbear_evaluator reference found"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run performance tracker
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
        run: node bullbear_performance.js
     
      - name: Run accuracy calculation
        run: node bullbear_accuracy.js
      - name: Run component analysis
        run: node bullbear_component_analysis.js

      - name: Run score-band analysis
        run: node bullbear_score_analysis.js
      - name: Save performance history
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bullbear_signal_performance.json data/bullbear_accuracy_history.json
          git diff --cached --quiet || git commit -m "Update BullBear performance history"
          git push
