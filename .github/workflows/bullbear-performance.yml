name: BullBear Performance

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  performance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run performance tracker
        run: node bullbear_performance.js

      - name: Save performance history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bullbear_signal_performance.json
          git diff --cached --quiet || git commit -m "Update BullBear performance history"
          git push
