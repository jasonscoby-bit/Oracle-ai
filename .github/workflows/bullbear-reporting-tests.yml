name: BullBear Reporting Tests

on:
  pull_request:
    paths:
      - "bullbear_component_analysis.js"
      - "bullbear_component_analysis.test.js"
      - "bullbear_score_analysis.js"\n      - "bullbear_evaluator.js"\n      - "bullbear_evaluator.test.js"\n      - "bullbear_calibration.js"\n      - "bullbear_calibration.test.js"
      - ".github/workflows/bullbear-reporting-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reporting-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run component analysis unit tests
        run: node --test bullbear_component_analysis.test.js
      - name: Run evaluator regression tests\n        run: node --test bullbear_evaluator.test.js\n      - name: Run calibration regression tests\n        run: node --test bullbear_calibration.test.js\n      - name: Verify reporting scripts parse
        run: |
          node --check bullbear_component_analysis.js
          node --check bullbear_score_analysis.js\n          node --check bullbear_evaluator.js\n          node --check bullbear_calibration.js
